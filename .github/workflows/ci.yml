name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  backend-lint-test:
    name: Backend - Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Ruff (lint)
        run: |
          ruff check api nodes utils main.py app_state.py || true   # warning-only au demarrage

      - name: Pytest + coverage
        run: |
          pytest tests/unit/backend tests/integration tests/system \
            -v --cov=api --cov=nodes --cov=utils \
            --cov-report=term-missing --cov-report=xml --cov-report=html \
            --cov-fail-under=70 || echo "::warning::coverage < 70% (threshold not yet enforced)"
        env:
          JWT_SECRET: test-secret-not-for-prod
          DB_PASSWORD: TestPass123!
          BLAZE_API_KEY: test-key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  frontend-lint-build:
    name: Frontend - Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install (fallback to npm install si lockfile out-of-sync)
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        env:
          NPM_CONFIG_FUND: false

      - name: Lint
        run: npm run lint || true

      - name: Vitest
        run: npm run test:run || true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

  e2e-playwright:
    name: E2E - Playwright
    runs-on: ubuntu-latest
    needs: [frontend-lint-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
          SKIP_DEV_SERVER: ""

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: agent-dw-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: agent-dw-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build local backend
        run: docker build -f docker/Dockerfile.backend -t agent-dw-backend:scan .

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agent-dw-backend:scan
          severity: CRITICAL,HIGH
          exit-code: 0   # warning-only au demarrage
          ignore-unfixed: true
