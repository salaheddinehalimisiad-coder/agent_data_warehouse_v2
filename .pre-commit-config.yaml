repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.0
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v8.57.0
  hooks:
    - id: eslint
      files: \.[jt]sx?$
      types: [file]
      args: [ --max-warnings, "0" ]

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v3.1.0
  hooks:
    - id: prettier
      types_or: [javascript, jsx, css, html, yaml, markdown]
