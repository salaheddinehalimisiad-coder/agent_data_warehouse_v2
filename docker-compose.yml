# docker-compose.yml — Mission 1 : Infrastructure SQL Server + Backend FastAPI
# Volume partagé ./uploads : backend écrit le .bak → SQL Server lit et restaure
version: '3.9'

networks:
  agent_dw_net:
    driver: bridge

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent_dw_sqlserver
    restart: unless-stopped
    networks:
      - agent_dw_net
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
      - sql_log:/var/opt/mssql/log
      - ./uploads/bak:/var/opt/mssql/backup
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No -C || exit 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agent_dw_backend
    restart: unless-stopped
    networks:
      - agent_dw_net
    env_file: .env
    environment:
      DB_HOST: "sqlserver"
      DB_USER: "sa"
      DB_PASSWORD: "${DB_PASSWORD:-StrongP@ssw0rd!}"
      SQLSERVER_BACKUP_MOUNT_DIR: "/var/opt/mssql/backup"
      SQLSERVER_DATA_DIR: "/var/opt/mssql/data"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      BLAZE_API_KEY: "${BLAZE_API_KEY:-sk-blaze-wuAdOktbeX65NxuxmnLrimuMxrQGeTymxsSMpyxLEi1RWkOH}"
      BLAZE_BASE_URL: "${BLAZE_BASE_URL:-https://api.blaze.ai/v1}"
      BLAZE_MODEL: "${BLAZE_MODEL:-glm-5}"
    volumes:
      - ./uploads/bak:/app/uploads/bak
      - ./outputs:/app/outputs
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  sql_data:
    driver: local
  sql_log:
    driver: local