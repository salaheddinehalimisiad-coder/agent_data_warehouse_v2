# docker-compose.yml - Stack DEV (sqlserver + backend + optionnel frontend)
# Usage:
#   docker compose up -d                    # backend + db
#   docker compose --profile full up -d     # + frontend
#
# Pour la prod, utiliser docker-compose.deploy.yml
#
# Secrets : copier .env.example -> .env et remplir DB_PASSWORD, BLAZE_API_KEY, JWT_SECRET.
# JAMAIS committer .env.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  agent_dw_net:
    driver: bridge

volumes:
  sql_data:
    driver: local
  sql_log:
    driver: local
  outputs:
    driver: local
  uploads_bak:
    driver: local

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent_dw_sqlserver
    restart: unless-stopped
    networks: [agent_dw_net]
    # IMPORTANT : on garde l'utilisateur mssql par defaut (uid 10001).
    # Le user: root precedent etait dangereux et inutile.
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD obligatoire (mettre dans .env)}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_TCP_PORT: "1433"
    ports:
      - "${SQLSERVER_HOST_PORT:-14330}:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
      - sql_log:/var/opt/mssql/log
      - uploads_bak:/var/opt/mssql/backup
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No -C || exit 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4g

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      cache_from:
        - agent_dw_backend:cache
    image: agent_dw_backend:dev
    container_name: agent_dw_backend
    restart: unless-stopped
    networks: [agent_dw_net]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: "sqlserver"
      DB_PORT: "1433"
      DB_USER: "sa"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD obligatoire}"
      SQLSERVER_BACKUP_MOUNT_DIR: "/var/opt/mssql/backup"
      SQLSERVER_DATA_DIR: "/var/opt/mssql/data"
      BAK_UPLOAD_DIR: "/app/uploads/bak"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      # Secrets via .env, pas de defaut hardcode
      BLAZE_API_KEY: "${BLAZE_API_KEY:?BLAZE_API_KEY obligatoire}"
      BLAZE_BASE_URL: "${BLAZE_BASE_URL:-https://api.blaze.ai/v1}"
      BLAZE_MODEL: "${BLAZE_MODEL:-glm-5}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET obligatoire}"
      WORKERS: "${BACKEND_WORKERS:-2}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      APP_ENV: "${APP_ENV:-development}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}"
    volumes:
      - uploads_bak:/app/uploads/bak
      - outputs:/app/outputs
      # Hot reload en dev : decommenter UNIQUEMENT si APP_ENV=development
      # - ./api:/app/api
      # - ./nodes:/app/nodes
      # - ./utils:/app/utils
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    profiles: ["full"]   # demarre uniquement avec --profile full
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    image: agent_dw_frontend:dev
    container_name: agent_dw_frontend
    restart: unless-stopped
    networks: [agent_dw_net]
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
