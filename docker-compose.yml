# docker-compose.yml — Mission 1 : Infrastructure SQL Server + Backend FastAPI
# Volume partagé ./uploads : backend écrit le .bak → SQL Server lit et restaure
version: '3.9'

networks:
  agent_dw_net:
    driver: bridge

services:

  # ── SQL Server 2022 ─────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent_dw_sqlserver
    restart: unless-stopped
    networks:
      - agent_dw_net
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sql_data:/var/opt/mssql/data
      - sql_log:/var/opt/mssql/log
      # Volume partagé : le backend local Windows écrit ici, SQL Server lit d'ici
      - ./uploads/bak:/var/opt/mssql/backup
    healthcheck:
      # CORRECTION : mssql-tools18 (pas mssql-tools) dans les images 2022 récentes
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No -C || exit 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s   # SQL Server met ~20s à démarrer

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agent_dw_backend
    restart: unless-stopped
    networks:
      - agent_dw_net
    env_file: .env
    environment:
      DB_HOST: "sqlserver"
      DB_USER: "sa"
      DB_PASSWORD: "${DB_PASSWORD:-StrongP@ssw0rd!}"
      # CORRECTION : chemin Linux dans le conteneur SQL Server
      SQLSERVER_BACKUP_MOUNT_DIR: "/var/opt/mssql/backup"
      # CORRECTION : chemin Linux des fichiers de données SQL Server
      SQLSERVER_DATA_DIR: "/var/opt/mssql/data"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    volumes:
      # Volume partagé : le backend écrit ici, SQL Server lit depuis ce même volume
      - ./uploads/bak:/app/uploads/bak
      - ./outputs:/app/outputs
      - .:/app  # Hot reload
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 2g

  # ── Frontend (désactivé pour Mission 1 — décommenter plus tard) ─────────────
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.frontend
  #   ...

volumes:
  sql_data:
    driver: local
  sql_log:
    driver: local
