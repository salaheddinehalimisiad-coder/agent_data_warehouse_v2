<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Agent BI">
  <defs>
    <linearGradient id="fgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="fbarGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#fbg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" fill="none" stroke="url(#fgGrad)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Inner hexagon -->
  <polygon points="16,5 27,11 27,21 16,27 5,21 5,11"
           fill="none" stroke="url(#fgGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 3 BI bars forming an "A" rhythm -->
  <rect x="9" y="16" width="2.2" height="6" rx="0.7" fill="url(#fbarGrad)"/>
  <rect x="14.9" y="11" width="2.2" height="11" rx="0.7" fill="url(#fbarGrad)"/>
  <rect x="20.8" y="14" width="2.2" height="8" rx="0.7" fill="url(#fbarGrad)"/>

  <!-- Neural path -->
  <path d="M10.1 16 L16 11 L21.9 14" fill="none" stroke="#C4B5FD" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- AI core spark (top) -->
  <circle cx="16" cy="5" r="2.5" fill="#A855F7" opacity="0.35"/>
  <circle cx="16" cy="5" r="1.3" fill="#FFFFFF"/>
</svg>
