<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Agent BI">
  <defs>
    <linearGradient id="fBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1"    stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="fChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="fCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#C4B5FD" stop-opacity="0.7"/>
      <stop offset="1"    stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded chip background -->
  <rect width="32" height="32" rx="7" fill="url(#fChip)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5"
        fill="none" stroke="url(#fBrand)" stroke-width="1.2" stroke-opacity="0.65"/>

  <!-- Neural "A" (Agent) -->
  <g stroke="url(#fBrand)" stroke-linecap="round">
    <line x1="9"  y1="25" x2="16" y2="9"  stroke-width="2.2"/>
    <line x1="23" y1="25" x2="16" y2="9"  stroke-width="2.2"/>
    <line x1="11.6" y1="19" x2="20.4" y2="19" stroke-width="1.8"/>
  </g>

  <!-- Graph nodes -->
  <circle cx="9"    cy="25" r="1.6" fill="#E0E7FF"/>
  <circle cx="23"   cy="25" r="1.6" fill="#E0E7FF"/>
  <circle cx="11.6" cy="19" r="1.2" fill="#C4B5FD"/>
  <circle cx="20.4" cy="19" r="1.2" fill="#C4B5FD"/>

  <!-- AI core orb at apex -->
  <circle cx="16" cy="9" r="4.5" fill="url(#fCore)"/>
  <circle cx="16" cy="9" r="2"   fill="#FFFFFF"/>
  <circle cx="16" cy="9" r="0.9" fill="#A855F7"/>
</svg>
