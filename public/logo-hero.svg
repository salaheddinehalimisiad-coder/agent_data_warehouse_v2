<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Agent BI">
  <defs>
    <linearGradient id="hBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1"    stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="hChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14142B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>

    <radialGradient id="hCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="1"    stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hHalo" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="hGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="hSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient halo -->
  <circle cx="64" cy="68" r="60" fill="url(#hHalo)"/>

  <!-- Faint orbital ring to evoke multi-agent mesh -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#hBrand)" stroke-width="0.8" stroke-opacity="0.18" stroke-dasharray="2 4"/>

  <!-- Rounded chip / agent frame -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24"
        fill="url(#hChip)"
        stroke="url(#hBrand)" stroke-width="3.2"
        filter="url(#hGlow)"/>

  <!-- Inner faint frame -->
  <rect x="18" y="18" width="92" height="92" rx="18" ry="18"
        fill="none" stroke="url(#hBrand)" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Subtle grid ticks (data/intelligence substrate) -->
  <g stroke="url(#hBrand)" stroke-width="0.7" stroke-opacity="0.14">
    <line x1="18" y1="48"  x2="110" y2="48"/>
    <line x1="18" y1="80"  x2="110" y2="80"/>
    <line x1="48" y1="18"  x2="48"  y2="110"/>
    <line x1="80" y1="18"  x2="80"  y2="110"/>
  </g>

  <!-- Neural mesh edges (behind the A) -->
  <g stroke="#C4B5FD" stroke-width="1.2" stroke-opacity="0.45" stroke-linecap="round">
    <line x1="32" y1="100" x2="44" y2="74"/>
    <line x1="96" y1="100" x2="84" y2="74"/>
    <line x1="32" y1="100" x2="16" y2="88"/>
    <line x1="96" y1="100" x2="112" y2="88"/>
    <line x1="44" y1="74"  x2="24" y2="56"/>
    <line x1="84" y1="74"  x2="104" y2="56"/>
    <line x1="64" y1="32"  x2="40" y2="30"/>
    <line x1="64" y1="32"  x2="88" y2="30"/>
  </g>

  <!-- === Neural "A" (for Agent) === -->
  <g filter="url(#hSoft)">
    <line x1="32" y1="100" x2="64" y2="32"
          stroke="url(#hBrand)" stroke-width="6" stroke-linecap="round"/>
    <line x1="96" y1="100" x2="64" y2="32"
          stroke="url(#hBrand)" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="74"  x2="84" y2="74"
          stroke="url(#hBrand)" stroke-width="4.8" stroke-linecap="round"/>
  </g>

  <!-- Primary graph nodes on the A -->
  <circle cx="32" cy="100" r="5.2" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2"/>
  <circle cx="96" cy="100" r="5.2" fill="#E0E7FF" stroke="#A855F7" stroke-width="1.2"/>
  <circle cx="44" cy="74"  r="4"   fill="#C4B5FD"/>
  <circle cx="84" cy="74"  r="4"   fill="#C4B5FD"/>

  <!-- Peripheral agent satellites -->
  <circle cx="16"  cy="88" r="3.2" fill="#6366F1"/>
  <circle cx="112" cy="88" r="3.2" fill="#A855F7"/>
  <circle cx="24"  cy="56" r="2.6" fill="#8B5CF6"/>
  <circle cx="104" cy="56" r="2.6" fill="#8B5CF6"/>
  <circle cx="40"  cy="30" r="2.2" fill="#C4B5FD"/>
  <circle cx="88"  cy="30" r="2.2" fill="#C4B5FD"/>

  <!-- AI core orb at apex of the A -->
  <circle cx="64" cy="32" r="17" fill="url(#hCore)"/>
  <circle cx="64" cy="32" r="7"  fill="#FFFFFF"/>
  <circle cx="64" cy="32" r="3"  fill="#A855F7"/>
</svg>
