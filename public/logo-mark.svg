<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Agent BI">
  <defs>
    <!-- Frame gradient (violet → indigo → purple) -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Bars gradient (ascending glow) -->
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>

    <!-- Soft halo behind the mark -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner fill for the hex — very dark, high contrast -->
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#14142B"/>
    </linearGradient>

    <!-- Glow for the AI spark -->
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient halo -->
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>

  <!-- Hexagonal prism: pointy-top, 6 vertices -->
  <polygon points="32,5 55.5,18 55.5,46 32,59 8.5,46 8.5,18"
           fill="url(#hexFill)"
           stroke="url(#frame)"
           stroke-width="2.4"
           stroke-linejoin="round"/>

  <!-- Inner faint hex (depth) -->
  <polygon points="32,13 48.5,22 48.5,42 32,51 15.5,42 15.5,22"
           fill="none"
           stroke="url(#frame)"
           stroke-width="0.8"
           stroke-opacity="0.25"
           stroke-linejoin="round"/>

  <!-- Analytics baseline -->
  <line x1="17" y1="44" x2="47" y2="44"
        stroke="url(#frame)" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Three ascending bars — BI/analytics ridge forming an implicit "A" -->
  <rect x="19" y="31" width="4.4" height="13" rx="1.2" fill="url(#bars)"/>
  <rect x="29.8" y="22" width="4.4" height="22" rx="1.2" fill="url(#bars)"/>
  <rect x="40.6" y="27" width="4.4" height="17" rx="1.2" fill="url(#bars)"/>

  <!-- Neural connectors between bar tops (data flow) -->
  <path d="M21.2 31 L32 22 L42.8 27" fill="none"
        stroke="#C4B5FD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- Bar-top nodes -->
  <circle cx="21.2" cy="31" r="1.6" fill="#E0E7FF"/>
  <circle cx="32"   cy="22" r="2.0" fill="#FFFFFF"/>
  <circle cx="42.8" cy="27" r="1.6" fill="#E0E7FF"/>

  <!-- AI spark orb on top — multi-agent core -->
  <circle cx="32" cy="5" r="6" fill="url(#sparkGlow)"/>
  <circle cx="32" cy="5" r="2.4" fill="#FFFFFF"/>
  <circle cx="32" cy="5" r="1" fill="#A855F7"/>

  <!-- Agent orbit dots on hex vertices -->
  <circle cx="55.5" cy="18" r="1.5" fill="#A855F7"/>
  <circle cx="55.5" cy="46" r="1.5" fill="#6366F1"/>
  <circle cx="32"   cy="59" r="1.5" fill="#8B5CF6"/>
  <circle cx="8.5"  cy="46" r="1.5" fill="#6366F1"/>
  <circle cx="8.5"  cy="18" r="1.5" fill="#A855F7"/>
</svg>
